services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api-local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolution

  mysql:
    image: mysql:8.0
    container_name: evolution-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${EVOLUTION_DB_NAME:-evolution}
      MYSQL_USER: ${EVOLUTION_DB_USER:-evolution}
      MYSQL_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD in evolution/.env}
      MYSQL_ROOT_PASSWORD: ${EVOLUTION_DB_ROOT_PASSWORD:?Set EVOLUTION_DB_ROOT_PASSWORD in evolution/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - evolution-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - evolution

  redis:
    image: redis:7-alpine
    container_name: evolution-redis-local
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evolution

networks:
  evolution:

volumes:
  evolution-mysql:
  evolution-redis:
